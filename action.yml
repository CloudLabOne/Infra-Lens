name: 'Infra-Lens'
description: 'AI summaries for AWS CDK diffs, posted on every PR. Powered by Claude.'
author: 'CloudLabOne'

inputs:
  anthropic-api-key:
    description: 'Anthropic API key. Get one at console.anthropic.com.'
    required: true
  cdk-diff-file:
    description: 'Path to the CDK diff JSON file. See README for the expected format.'
    required: false
    default: 'cdk-diff.json'
  output-format:
    description: 'Render format for the summary.'
    required: false
    default: 'markdown'
  language:
    description: 'Summary language (en, nl).'
    required: false
    default: 'en'
  model:
    description: 'Claude model ID. Defaults to claude-opus-4-7.'
    required: false
    default: 'claude-opus-4-7'
  max-tokens:
    description: 'Maximum tokens in the summary.'
    required: false
    default: '1024'
  fail-on-destructive:
    description: 'Fail the workflow if destructive changes (destroy/replace) are detected.'
    required: false
    default: 'false'
  post-comment:
    description: 'Post the summary as a PR comment.'
    required: false
    default: 'true'
  create-issue:
    description: 'If there is no PR, create an issue with the summary instead.'
    required: false
    default: 'false'

outputs:
  summary:
    description: 'The generated summary.'
  success:
    description: 'true on success, false on failure.'
  issue-number:
    description: 'PR or issue number that received the comment, if any.'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r ${{ github.action_path }}/requirements.txt

    - name: Run Infra-Lens
      shell: bash
      working-directory: ${{ github.workspace }}
      run: python ${{ github.action_path }}/src/main.py
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CDK_DIFF_FILE: ${{ inputs.cdk-diff-file }}
        OUTPUT_FORMAT: ${{ inputs.output-format }}
        LANGUAGE: ${{ inputs.language }}
        AI_MODEL: ${{ inputs.model }}
        AI_MAX_TOKENS: ${{ inputs.max-tokens }}
        FAIL_ON_DESTRUCTIVE: ${{ inputs.fail-on-destructive }}
        POST_COMMENT: ${{ inputs.post-comment }}
        CREATE_ISSUE: ${{ inputs.create-issue }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}

branding:
  icon: 'eye'
  color: 'purple'
