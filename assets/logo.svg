<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Magnifying glass body -->
  <circle cx="50" cy="50" r="32" stroke="url(#lens)" stroke-width="7" fill="none"/>

  <!-- Handle -->
  <line x1="74" y1="74" x2="102" y2="102"
        stroke="url(#lens)" stroke-width="9" stroke-linecap="round"/>

  <!-- Infrastructure stack inside the lens -->
  <g transform="translate(50 50)" stroke="url(#lens)" stroke-width="3.5"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- bottom layer -->
    <path d="M-16 10 L0 18 L16 10 L0 2 Z"/>
    <!-- middle layer -->
    <path d="M-12 0 L0 6 L12 0"/>
    <!-- top layer -->
    <path d="M-8 -10 L0 -6 L8 -10"/>
  </g>
</svg>
